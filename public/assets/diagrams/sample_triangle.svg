<svg xmlns="http://www.w3.org/2000/svg" width="300" height="250" viewBox="0 0 300 250" role="img" aria-label="Triangle diagram">
  <title>Triangle with labeled angles</title>
  <desc>A triangle showing angle A at 45 degrees, angle B at 60 degrees, and angle C to be determined</desc>
  
  <!-- Triangle outline -->
  <polygon points="150,30 50,200 250,200" 
           fill="none" 
           stroke="#2563eb" 
           stroke-width="2"/>
  
  <!-- Vertex labels with angles -->
  <text x="150" y="25" 
        text-anchor="middle" 
        font-size="16" 
        fill="#1e40af" 
        font-family="Arial, sans-serif">A (45°)</text>
  
  <text x="35" y="205" 
        text-anchor="middle" 
        font-size="16" 
        fill="#1e40af" 
        font-family="Arial, sans-serif">B (60°)</text>
  
  <text x="265" y="205" 
        text-anchor="middle" 
        font-size="16" 
        fill="#1e40af" 
        font-family="Arial, sans-serif">C (?)</text>
  
  <!-- Vertex markers -->
  <circle cx="150" cy="30" r="3" fill="#2563eb"/>
  <circle cx="50" cy="200" r="3" fill="#2563eb"/>
  <circle cx="250" cy="200" r="3" fill="#2563eb"/>
</svg>
