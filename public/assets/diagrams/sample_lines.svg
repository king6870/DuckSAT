<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="Linear model graph">
  <title>Study Hours vs Test Scores</title>
  <desc>A scatter plot showing a positive linear relationship between hours studied and test scores</desc>
  
  <!-- Axes -->
  <line x1="50" y1="250" x2="350" y2="250" 
        stroke="#374151" 
        stroke-width="2"/>
  <line x1="50" y1="250" x2="50" y2="30" 
        stroke="#374151" 
        stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="200" y="285" 
        text-anchor="middle" 
        font-size="14" 
        fill="#1f2937"
        font-family="Arial, sans-serif">Hours Studied</text>
  
  <text x="20" y="140" 
        text-anchor="middle" 
        font-size="14" 
        fill="#1f2937"
        font-family="Arial, sans-serif"
        transform="rotate(-90 20 140)">Test Score</text>
  
  <!-- Data points -->
  <circle cx="80" cy="220" r="4" fill="#2563eb"/>
  <circle cx="110" cy="205" r="4" fill="#2563eb"/>
  <circle cx="140" cy="185" r="4" fill="#2563eb"/>
  <circle cx="170" cy="170" r="4" fill="#2563eb"/>
  <circle cx="200" cy="150" r="4" fill="#2563eb"/>
  <circle cx="230" cy="135" r="4" fill="#2563eb"/>
  <circle cx="260" cy="115" r="4" fill="#2563eb"/>
  <circle cx="290" cy="100" r="4" fill="#2563eb"/>
  
  <!-- Trend line -->
  <line x1="70" y1="230" x2="300" y2="90" 
        stroke="#ef4444" 
        stroke-width="2" 
        stroke-dasharray="5,5"/>
  
  <!-- X-axis tick labels -->
  <text x="60" y="265" text-anchor="middle" font-size="12" fill="#6b7280" font-family="Arial, sans-serif">0</text>
  <text x="110" y="265" text-anchor="middle" font-size="12" fill="#6b7280" font-family="Arial, sans-serif">2</text>
  <text x="170" y="265" text-anchor="middle" font-size="12" fill="#6b7280" font-family="Arial, sans-serif">4</text>
  <text x="230" y="265" text-anchor="middle" font-size="12" fill="#6b7280" font-family="Arial, sans-serif">6</text>
  <text x="290" y="265" text-anchor="middle" font-size="12" fill="#6b7280" font-family="Arial, sans-serif">8</text>
  
  <!-- Y-axis tick labels -->
  <text x="40" y="255" text-anchor="end" font-size="12" fill="#6b7280" font-family="Arial, sans-serif">50</text>
  <text x="40" y="205" text-anchor="end" font-size="12" fill="#6b7280" font-family="Arial, sans-serif">60</text>
  <text x="40" y="155" text-anchor="end" font-size="12" fill="#6b7280" font-family="Arial, sans-serif">70</text>
  <text x="40" y="105" text-anchor="end" font-size="12" fill="#6b7280" font-family="Arial, sans-serif">80</text>
  <text x="40" y="55" text-anchor="end" font-size="12" fill="#6b7280" font-family="Arial, sans-serif">90</text>
</svg>
