<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blockcraft Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
:root {
  color-scheme: dark;
  --bg-top: rgba(12, 28, 36, 0.48);
  --bg-bottom: rgba(7, 13, 17, 0.86);
  --panel: rgba(11, 20, 25, 0.78);
  --panel-strong: rgba(16, 28, 34, 0.92);
  --line: rgba(185, 229, 214, 0.18);
  --text: #eff7ef;
  --muted: #b1c6b5;
  --accent: #9ce677;
  --accent-2: #f6b73c;
  --danger: #ff8f75;
  --shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "Chakra Petch", sans-serif;
  background:
    radial-gradient(circle at top, rgba(88, 153, 125, 0.4), transparent 38%),
    linear-gradient(180deg, #77c4ea 0%, #b8e6f2 36%, #dfe9b1 100%);
  color: var(--text);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 30%),
    repeating-linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.02) 0,
      rgba(255, 255, 255, 0.02) 12px,
      transparent 12px,
      transparent 24px
    );
}

#game-root,
#game-root canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.hud {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 24px;
  pointer-events: none;
}
