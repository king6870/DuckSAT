# Build and deploy Next.js standalone app to Azure Web App - ducksatapp
# Single-job: build and deploy on the same runner so .next/ (hidden dir) is
# never lost through an artifact upload/download step.
# (actions/upload-artifact@v4 excludes hidden files by default — that's why
#  splitting into two jobs always broke: .next/ was silently dropped.)

name: Build and deploy Node.js app to Azure Web App - ducksatapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci
        # postinstall script runs: prisma generate

      - name: Build app
        run: npm run build
        env:
          # Placeholder values — Next.js only connects to DB/Stripe at request time,
          # not at build time. Real values are in Azure App Service app settings.
          DATABASE_URL: sqlserver://placeholder:1433;database=placeholder;user=placeholder;password=placeholder;encrypt=true
          NEXTAUTH_SECRET: placeholder-build-secret-not-used-at-runtime
          NEXTAUTH_URL: https://www.ducksat.com
          STRIPE_SECRET_KEY: sk_test_placeholder_not_used_at_build_time

      - name: Package standalone build
        run: |
          mkdir -p deploy-package
          cp -r .next/standalone/. deploy-package/
          mkdir -p deploy-package/.next/static
          cp -r .next/static/. deploy-package/.next/static/
          cp -r public/. deploy-package/public/
          mkdir -p deploy-package/prisma
          cp -r prisma/. deploy-package/prisma/
          touch deploy-package/.skipOryxBuild
          echo "Package contents:"
          ls -la deploy-package/
          echo ".next contents:"
          ls deploy-package/.next/ | head -10
          echo "BUILD_ID: $(cat deploy-package/.next/BUILD_ID)"

      - name: Create deployment zip
        run: |
          cd deploy-package
          zip -r ../deploy.zip . --include='*' --include='.*' --include='.*/*'
          cd ..
          echo "zip size: $(du -sh deploy.zip | cut -f1)"
          # Verify .next is in the zip
          unzip -l deploy.zip | grep BUILD_ID

      - name: Deploy to Azure via Kudu VFS
        shell: python3 {0}
        env:
          PUBLISH_PROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_8471701F58524C9A8628229C7587AA3C }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          import xml.etree.ElementTree as ET, base64, urllib.request, urllib.error, json, os, zipfile, time, textwrap

          KUDU     = 'https://ducksatapp.scm.azurewebsites.net'
          WWWROOT  = '/home/site/wwwroot'
          ZIP_PATH = os.path.join(os.environ['WORKSPACE'], 'deploy.zip')

          # Parse publish profile for Kudu basic-auth credentials
          root = ET.fromstring(os.environ['PUBLISH_PROFILE'])
          prof = next(p for p in root.findall('publishProfile')
                      if p.get('publishMethod') == 'MSDeploy')
          user  = prof.get('userName')
          pwd   = prof.get('userPWD')
          token = base64.b64encode(f'{user}:{pwd}'.encode()).decode()
          auth  = f'Basic {token}'

          def kudu_cmd(cmd):
              body = json.dumps({'command': cmd, 'dir': '/'}).encode()
              req = urllib.request.Request(
                  f'{KUDU}/api/command', data=body, method='POST',
                  headers={'Authorization': auth, 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=300) as r:
                  return json.loads(r.read())

          def vfs_put(remote_path, data, content_type='application/octet-stream'):
              req = urllib.request.Request(
                  f'{KUDU}/api/vfs/{remote_path.lstrip("/")}',
                  data=data, method='PUT',
                  headers={'Authorization': auth, 'Content-Type': content_type, 'If-Match': '*'})
              with urllib.request.urlopen(req, timeout=300) as r:
                  return r.status

          def kudu_delete(path):
              req = urllib.request.Request(
                  f'{KUDU}{path}', method='DELETE',
                  headers={'Authorization': auth})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status
              except Exception:
                  return None

          def run_script(name, code):
              """Upload a .py file to wwwroot and execute it."""
              vfs_put(f'site/wwwroot/{name}', textwrap.dedent(code).encode(), 'text/plain')
              return kudu_cmd(f'python3 {WWWROOT}/{name}')

          # ---------------------------------------------------------------
          # DEPLOYMENT STRATEGY: Kudu /api/zipdeploy
          #
          # Previous attempts (Python zipfile extraction, system unzip) both
          # fail with:
          #   FileNotFoundError / "cannot create ... No such file or directory"
          #   for /home/site/wwwroot/node_modules/.prisma/client/libquery_engine-...
          #
          # Root cause: Azure App Service Linux mounts /home/site/wwwroot over
          # Azure Files SMB. Creating hidden subdirectories (names starting with
          # '.') inside existing directories on this SMB mount is unreliable —
          # mkdir appears to succeed but the directory is not visible to the
          # next open() call.  Both Python os.makedirs and the system unzip go
          # through the same SMB codepath and hit the same bug.
          #
          # Fix: POST the zip directly to /api/zipdeploy.  This endpoint runs
          # inside the Kudu process on the same machine as the App Service and
          # writes files through the native Linux VFS layer, not through the
          # SMB client.  It is the officially supported deployment method and
          # has no hidden-directory restrictions.
          # ---------------------------------------------------------------

          print('Reading deploy.zip...')
          with open(ZIP_PATH, 'rb') as f:
              zip_bytes = f.read()
          print(f'  {len(zip_bytes) // 1024 // 1024} MB')

          # Submit zip to zipdeploy (async so the POST returns quickly after upload)
          print('Submitting to zipdeploy...')
          req = urllib.request.Request(
              f'{KUDU}/api/zipdeploy?isAsync=true',
              data=zip_bytes, method='POST',
              headers={'Authorization': auth, 'Content-Type': 'application/zip'})
          try:
              with urllib.request.urlopen(req, timeout=600) as r:
                  status_url = r.headers.get('Location', '')
                  print(f'  accepted — polling: {status_url}')
          except urllib.error.HTTPError as e:
              raise RuntimeError(f"zipdeploy upload failed {e.code}: {e.read()[:300].decode()}")

          # Poll until deployment finishes (up to 8 minutes)
          for i in range(96):
              time.sleep(5)
              req = urllib.request.Request(status_url, headers={'Authorization': auth})
              with urllib.request.urlopen(req, timeout=30) as r:
                  s = json.loads(r.read())
              state    = s.get('status', 0)
              complete = s.get('complete', False)
              msg      = (s.get('status_text') or s.get('message', ''))[:80]
              print(f'  [{(i+1)*5}s] state={state} complete={complete} {msg}')
              if complete:
                  if state == 3:
                      raise RuntimeError(f"zipdeploy FAILED: {s.get('message', s)}")
                  print('  zipdeploy succeeded!')
                  break
          else:
              raise RuntimeError('zipdeploy timed out after 8 minutes')

          # Safety net: re-upload server.js directly in case zipdeploy missed it
          print('Uploading server.js (direct)...')
          with zipfile.ZipFile(ZIP_PATH) as z:
              vfs_put('site/wwwroot/server.js', z.read('server.js'), 'text/plain')

          # Verify
          print('Verifying...')
          r = run_script('_verify.py', f"""
              import os
              WR = '{WWWROOT}'
              build_id = open(os.path.join(WR, '.next', 'BUILD_ID')).read().strip()
              print('BUILD_ID:', build_id)
              print('server.js:', os.path.exists(os.path.join(WR, 'server.js')))
              engines = [f for f in os.listdir(os.path.join(WR, 'node_modules', '.prisma', 'client'))
                         if f.startswith('libquery')]
              print('prisma engines:', engines)
          """)
          if r['ExitCode'] != 0:
              raise RuntimeError(f"Verify failed: {r['Error']}")
          print(f"  {r['Output'].strip()}")

          # Cleanup temp scripts
          kudu_cmd(
              f'python3 -c "import os; '
              f'[os.remove(os.path.join(\'{WWWROOT}\', f)) '
              f'for f in os.listdir(\'{WWWROOT}\') '
              f'if f.startswith(\'_\') and f.endswith(\'.py\')]"'
          )

          # Restart app (zipdeploy already restarts, but be explicit)
          print('Restarting app...')
          kudu_delete('/api/processes/0')
          time.sleep(5)
          print('Deploy complete.')
