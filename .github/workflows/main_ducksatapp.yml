name: Build and deploy Node.js app to Azure Web App - ducksatapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install, Build, and Prepare Standalone
        run: |
          npm install
          npx prisma generate
          npm run build
          # Move static and public into standalone so they are part of the deployment
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          # Step 3: Crucial for Prisma - Copy the generated client into the standalone node_modules
          # Depending on your setup, it's usually in one of these two places:
          cp -r node_modules/.prisma .next/standalone/node_modules/ || true
          cp -r node_modules/@prisma .next/standalone/node_modules/ || true
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://www.ducksat.com
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Upload Standalone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-app
          path: .next/standalone/ # This uploads ONLY the content of the standalone folder

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-app
          path: ./app-to-deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_039F9C9C0C564771A2ACCA3AF759E665 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6C31A209E5C4498AB9E225DDF06B55C5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BE9F8AF358FA4905A22AAA1F2329A887 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ducksatapp'
          package: ./app-to-deploy # Pointing specifically to the downloaded folder

