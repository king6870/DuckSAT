# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - ducksatapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci
        # postinstall runs prisma generate here automatically

      - name: Build app (prisma generate + next build)
        run: npm run build
        env:
          # Placeholder values allow next build to complete without a live DB.
          # Real values are set as Azure App Service application settings at runtime.
          DATABASE_URL: sqlserver://placeholder:1433;database=placeholder;user=placeholder;password=placeholder;encrypt=true
          NEXTAUTH_SECRET: placeholder-build-secret-not-used-at-runtime
          NEXTAUTH_URL: https://www.ducksat.com

      - name: Prepare standalone deployment package
        run: |
          mkdir -p deploy-package
          # Copy the self-contained standalone server
          cp -r .next/standalone/. deploy-package/
          # Next.js standalone doesn't include static assets — copy them in
          mkdir -p deploy-package/.next/static
          cp -r .next/static/. deploy-package/.next/static/
          # Copy public folder (images, icons, robots.txt, etc.)
          mkdir -p deploy-package/public
          cp -r public/. deploy-package/public/
          # Copy Prisma schema (needed at runtime for some operations)
          mkdir -p deploy-package/prisma
          cp -r prisma/. deploy-package/prisma/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-package

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ducksatapp'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_8471701F58524C9A8628229C7587AA3C }}
