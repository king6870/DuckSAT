# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - ducksatapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci
        # postinstall runs prisma generate here automatically

      - name: Build app (prisma generate + next build)
        run: npm run build
        env:
          # Placeholder values allow next build to complete without a live DB or Stripe.
          # Real values are set as Azure App Service application settings at runtime.
          DATABASE_URL: sqlserver://placeholder:1433;database=placeholder;user=placeholder;password=placeholder;encrypt=true
          NEXTAUTH_SECRET: placeholder-build-secret-not-used-at-runtime
          NEXTAUTH_URL: https://www.ducksat.com
          STRIPE_SECRET_KEY: sk_test_placeholder_not_used_at_build_time

      - name: Prepare standalone deployment package
        run: |
          mkdir -p deploy-package
          # Copy the self-contained standalone server
          cp -r .next/standalone/. deploy-package/
          # Next.js standalone doesn't include static assets — copy them in
          mkdir -p deploy-package/.next/static
          cp -r .next/static/. deploy-package/.next/static/
          # Copy public folder (images, icons, robots.txt, etc.)
          mkdir -p deploy-package/public
          cp -r public/. deploy-package/public/
          # Copy Prisma schema (needed at runtime for some operations)
          mkdir -p deploy-package/prisma
          cp -r prisma/. deploy-package/prisma/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-package

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Create deployment zip
        run: |
          cd ${{ github.workspace }}
          zip -r deploy.zip . -x "deploy.zip"
          echo "zip size: $(du -sh deploy.zip | cut -f1)"

      - name: Deploy via Kudu VFS (bypasses Oryx optimizer)
        # azure/webapps-deploy@v3 uses /api/zipdeploy which triggers Oryx and
        # corrupts the standalone build (zips node_modules into tar.gz).
        # We use the VFS API instead: upload zip → run Python extract on Azure.
        shell: python3 {0}
        env:
          PUBLISH_PROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_8471701F58524C9A8628229C7587AA3C }}
        run: |
          import xml.etree.ElementTree as ET, base64, urllib.request, json, os, zipfile, time, textwrap

          KUDU = 'https://ducksatapp.scm.azurewebsites.net'
          WWWROOT = '/home/site/wwwroot'
          ZIP_PATH = os.path.join(os.environ['GITHUB_WORKSPACE'], 'deploy.zip')

          # --- Parse publish profile for Kudu basic-auth credentials ---
          root = ET.fromstring(os.environ['PUBLISH_PROFILE'])
          prof = next(p for p in root.findall('publishProfile')
                      if p.get('publishMethod') == 'MSDeploy')
          user = prof.get('userName')
          pwd  = prof.get('userPWD')
          token = base64.b64encode(f'{user}:{pwd}'.encode()).decode()
          auth_header = f'Basic {token}'

          def kudu_cmd(cmd):
              body = json.dumps({'command': cmd, 'dir': '/'}).encode()
              req = urllib.request.Request(
                  f'{KUDU}/api/command', data=body, method='POST',
                  headers={'Authorization': auth_header, 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=300) as r:
                  return json.loads(r.read())

          def vfs_put(remote_path, local_bytes, content_type='application/octet-stream'):
              req = urllib.request.Request(
                  f'{KUDU}/api/vfs/{remote_path.lstrip("/")}', data=local_bytes, method='PUT',
                  headers={'Authorization': auth_header, 'Content-Type': content_type, 'If-Match': '*'})
              with urllib.request.urlopen(req, timeout=300) as r:
                  return r.status

          def kudu_delete(path):
              req = urllib.request.Request(
                  f'{KUDU}{path}', method='DELETE',
                  headers={'Authorization': auth_header})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status
              except Exception:
                  return None

          def run_script(name, code):
              """Upload a Python script to wwwroot and execute it via Kudu command API."""
              vfs_put(f'site/wwwroot/{name}', textwrap.dedent(code).encode(), 'text/plain')
              return kudu_cmd(f'python3 {WWWROOT}/{name}')

          # ---------------------------------------------------------------
          # Step 1: Clean critical directories only.
          #
          # DO NOT use shutil.rmtree(wwwroot) — Azure SMB gives ENOTEMPTY on
          # deeply-nested dirs like node_modules/.prisma/client even after
          # files are deleted (kernel cache race). Instead:
          #   • Delete .next/, src/, public/, prisma/ with ignore_errors=True
          #     so the new build artifacts land in a clean state.
          #   • Leave node_modules/ in place — extraction overwrites what it needs.
          # ---------------------------------------------------------------
          print('Cleaning stale build artifacts (best-effort)...')
          clean_result = run_script('_clean.py', f"""
              import shutil, os
              WR = '{WWWROOT}'
              # Directories that must be fresh on every deploy
              for d in ['.next', 'src', 'public', 'prisma']:
                  p = os.path.join(WR, d)
                  if os.path.isdir(p):
                      shutil.rmtree(p, ignore_errors=True)
              # Root-level files (server.js, package.json, etc.)
              for f in os.listdir(WR):
                  fp = os.path.join(WR, f)
                  if os.path.isfile(fp) and not f.startswith('_'):
                      try:
                          os.remove(fp)
                      except OSError:
                          pass
              os.makedirs(WR, exist_ok=True)
              print('clean ok')
          """)
          # Log but never abort — if some stale files remain, extraction will overwrite them.
          print(f"  clean stdout: {clean_result['Output'].strip()}")
          if clean_result['Error']:
              print(f"  clean stderr (non-fatal): {clean_result['Error'][:300]}")

          # ---------------------------------------------------------------
          # Step 2: Upload deploy.zip
          # ---------------------------------------------------------------
          print('Uploading deploy.zip...')
          with open(ZIP_PATH, 'rb') as f:
              zip_bytes = f.read()
          vfs_put('site/wwwroot/deploy.zip', zip_bytes, 'application/zip')
          print(f'  uploaded {len(zip_bytes) // 1024 // 1024} MB')

          # ---------------------------------------------------------------
          # Step 3: Extract the zip on Azure with Python.
          #         zipfile.extractall overwrites existing files cleanly.
          # ---------------------------------------------------------------
          print('Extracting zip on Azure...')
          extract_result = run_script('_extract.py', f"""
              import zipfile
              z = zipfile.ZipFile('{WWWROOT}/deploy.zip')
              z.extractall('{WWWROOT}')
              z.close()
              print('Extracted', len(z.namelist()), 'files')
          """)
          if extract_result['ExitCode'] != 0:
              raise RuntimeError(f"Extract failed: {extract_result['Error']}")
          print(f"  {extract_result['Output'].strip()}")

          # ---------------------------------------------------------------
          # Step 4: Upload server.js directly.
          #         Python's zipfile.extractall on Azure SMB sometimes skips
          #         root-level files — upload it explicitly as a guarantee.
          # ---------------------------------------------------------------
          print('Uploading server.js (direct, guaranteed)...')
          with zipfile.ZipFile(ZIP_PATH) as z:
              server_js = z.read('server.js')
          vfs_put('site/wwwroot/server.js', server_js, 'text/plain')

          # ---------------------------------------------------------------
          # Step 5: Verify the deploy landed correctly.
          # ---------------------------------------------------------------
          verify_result = run_script('_verify.py', f"""
              import os
              WR = '{WWWROOT}'
              build_id = open(os.path.join(WR, '.next', 'BUILD_ID')).read().strip()
              print('BUILD_ID:', build_id)
              print('server.js:', os.path.exists(os.path.join(WR, 'server.js')))
              engines = [f for f in os.listdir(os.path.join(WR, 'node_modules', '.prisma', 'client'))
                         if f.startswith('libquery')]
              print('prisma engines:', engines)
          """)
          if verify_result['ExitCode'] != 0:
              raise RuntimeError(f"Verify failed — BUILD_ID missing? {verify_result['Error']}")
          print(f"  {verify_result['Output'].strip()}")

          # ---------------------------------------------------------------
          # Step 6: Clean up temp scripts and restart the app process.
          # ---------------------------------------------------------------
          kudu_cmd(
              f'python3 -c "import os; '
              f'[os.remove(os.path.join(\'{WWWROOT}\', f)) '
              f' for f in os.listdir(\'{WWWROOT}\') if f.startswith(\'_\') and f.endswith(\'.py\')]"'
          )
          kudu_cmd(f'python3 -c "import os; os.remove(\'{WWWROOT}/deploy.zip\')"')

          print('Restarting app via Kudu process manager...')
          kudu_delete('/api/processes/0')
          time.sleep(5)
          print('Deploy complete.')

      # App restart is handled via Kudu process 0 kill above (no Azure CLI needed).
